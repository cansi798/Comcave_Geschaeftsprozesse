async function oeffnen(code){
 const raw=Uint8Array.from(atob(DATEN),c=>c.charCodeAt(0));
 const salt=raw.slice(8,16),ct=raw.slice(16);
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveBits"]);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},base,384));
 const key=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-CBC",iv:bits.slice(32,48)},key,ct);
 const d=JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(pt));
 if(d.marker!=="gp2026") throw new Error("falsch");
 D=d; try{localStorage.setItem("gp2026code",code)}catch(e){}
 $("#tor").style.display="none"; $("#app").classList.add("on");
 aufbauen(); route();
}
$("#f").addEventListener("submit",async e=>{e.preventDefault();const c=$("#c").value.trim().toUpperCase();
 try{await oeffnen(c);$("#err").textContent=""}catch(x){$("#err").textContent="Der Zugangscode stimmt nicht."}});
(async()=>{let c=null;try{c=localStorage.getItem("gp2026code")}catch(e){} if(c){try{await oeffnen(c)}catch(e){try{localStorage.removeItem("gp2026code")}catch(_){}}}})();

function heuteISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function heuteTag(){const h=heuteISO();return D.reihenfolge.find(n=>D.tage[n].datum===h)||null}
function naechsterTag(){const h=heuteISO();return D.reihenfolge.find(n=>D.tage[n].datum>h)||null}
function istHeute(n){return D.tage[n].datum===heuteISO()}

 $("#tbMenue").innerHTML=I("menue");$("#tbZurueck").innerHTML=I("links");
 $("#tbMenue").onclick=()=>menue(true);$("#schleier").onclick=()=>menue(false);
 $("#tbZurueck").onclick=()=>{location.hash=ZURUECK||"#"};
 $("#seite").addEventListener("click",e=>{if(e.target.closest("a"))menue(false)});
 $("#unten").innerHTML='<a href="#" data-r="start">'+I("haus")+'Übersicht</a><a href="#heute" data-r="heute">'+I("kal")+'Heute</a><a href="#trainer" data-r="trainer">'+I("ziel")+'Trainer</a><button id="ubTage">'+I("liste")+'Alle Tage</button>';
 $("#ubTage").onclick=()=>menue(true);
 $("#einklapp").innerHTML=I("leiste");$("#ausklapp").innerHTML=I("leisteauf")+"Navigation";
 const leiste=zu=>{$("#app").classList.toggle("zu-seite",zu);try{localStorage.setItem("gp2026leiste",zu?"zu":"auf")}catch(e){}};
 $("#einklapp").onclick=()=>leiste(true);$("#ausklapp").onclick=()=>leiste(false);
 try{if(localStorage.getItem("gp2026leiste")==="zu")$("#app").classList.add("zu-seite")}catch(e){}
 document.addEventListener("keydown",e=>{if(e.key==="Escape")menue(false)});

  h+='<details'+(offen?" open":"")+'><summary>'+E(t.kurz)+' · '+E(t.lang)+'</summary>'+t.tage.map(n=>'<a href="#tag'+n+'" class="tg'+(aktTag===n?" aktiv":"")+(istHeute(n)?" heute":"")+'"><b>'+n+'</b><em>'+E(D.tage[n].titel)+'</em></a>').join("")+'</details>'});

function kachel(o){

 const inner='<span class="ic">'+I(o.zu?"schloss":o.icon)+'</span><span><span class="kt">'+E(o.titel)+'</span><br><span class="kx">'+E(o.text)+'</span></span>'+(o.badge&&!o.breit?'<span class="bd">'+E(o.badge)+'</span>':"")+(o.breit&&!o.zu?'<span class="pf">'+I("rechts")+'</span>':"");
 if(o.zu||!o.href) return '<div class="'+cls+'">'+inner+'</div>';
 return '<a class="'+cls+'" href="'+E(o.href)+'"'+(o.extern?' target="_blank" rel="noopener"':"")+'>'+inner+'</a>';

function route(){
 if(!D) return;
 if(QUIZ&&QUIZ.stop) QUIZ.stop(); QUIZ=null;
 document.querySelectorAll("video").forEach(v=>v.pause());
 menue(false);
 const h=decodeURIComponent((location.hash||"").slice(1));
 const H=$("#haupt");
 if(h==="heute"){const t=heuteTag()||naechsterTag(); location.replace(t?"#tag"+t:"#"); return}
 const m=h.match(/^tag(\d\d)(?:-(nachmittag|video|quiz|uebung1|uebung2))?$/);
 if(m&&D.tage[m[1]]){const n=m[1],s=m[2]||"";
  if(!s) H.innerHTML=seiteTag(n);
  else if(s==="nachmittag") H.innerHTML=seiteNachmittag(n);
  else if(s==="video") H.innerHTML=seiteVideo(n);
  else seiteQuiz(H,n,s);
 } else if(h==="trainer") seiteTrainer(H,false);
 else if(h==="klausur") seiteTrainer(H,true);
 else H.innerHTML=seiteStart();
 window.scrollTo(0,0);
}

async function seiteQuiz(H,n,s){const d=D.tage[n];
 const uebung=s.indexOf("uebung")===0,nr=uebung?s.slice(-1):"";
 const zur=uebung?["Zurück zum Nachmittag","#tag"+n+"-nachmittag"]:["Zurück zu Tag "+n,"#tag"+n];
 const name=uebung?"Übungsquiz "+nr:"Quiz";
 const bc=[["Übersicht","#"],["Tag "+n,"#tag"+n]].concat(uebung?[["Nachmittag","#tag"+n+"-nachmittag"]]:[]).concat([[name,""]]);
 let kopf=rahmen({kurz:"Tag "+n+" · "+name,bc:bc,zurueck:zur,akt:"tag",tag:n});
 const frei=uebung?d.frei2:d.frei1;
 const quelle=uebung?(d.uebungen||[]).find(u=>u.nr===nr):(d.quiz?{src:d.quiz}:null);
 kopf+='<h1 class="st">Tag '+n+' · '+name+'</h1><p class="sub">'+E(d.titel)+'</p>';
 if(!frei||!quelle){H.innerHTML=kopf+'<p>Dieses Quiz ist noch gesperrt.</p>'+fuss();return}
 H.innerHTML=kopf+'<div id="qz"><div class="laden">Fragen werden geladen …</div></div><div class="knoepfe" style="margin-top:8px"><a class="knopf hell" href="'+zur[1]+'">'+I("links")+E(zur[0])+'</a></div>'+fuss();
 try{const r=await fetch(quelle.src);const fr=await r.json(); if(location.hash.slice(1)!=="tag"+n+"-"+s) return;
  QUIZ=quiz($("#qz"),fr,{modus:"sofort"});}catch(e){$("#qz").innerHTML='<p>Die Fragen konnten nicht geladen werden. Bitte Seite neu laden.</p>'}
}
async function seiteTrainer(H,klausur){
 const name=klausur?"Probeklausur":"Quiz-Trainer",r0=klausur?"klausur":"trainer";
 let h=rahmen({kurz:name,bc:[["Übersicht","#"],[name,""]],zurueck:["Übersicht","#"],akt:r0});
 h+='<h1 class="st">'+name+'</h1><p class="sub">'+(klausur?"30 zufällige Fragen aus allen freigegebenen Tagen. Die Auswertung kommt am Ende, mit Note nach IHK-Schlüssel.":"Fragen gezielt nach Teil, Tag oder Quizart üben.")+'</p><div id="tr"><div class="laden">Fragen werden geladen …</div></div>'+fuss();
 H.innerHTML=h;
 if(!D.kurs){$("#tr").innerHTML="<p>Noch nicht verfügbar.</p>";return}
 try{if(!POOL){const r=await fetch(D.kurs.pool);POOL=await r.json()}}catch(e){$("#tr").innerHTML='<p>Die Fragen konnten nicht geladen werden. Bitte Seite neu laden.</p>';return}
 if(location.hash.slice(1)!==r0) return;
 const T=$("#tr");
 const teile=[...new Set(POOL.map(q=>q.teil))].sort(),tage=[...new Set(POOL.map(q=>q.tag))].sort();
 const opt=(a,f)=>a.map(x=>'<option value="'+E(x)+'">'+E(f(x))+'</option>').join("");
 let form='<div class="karte"><div class="felder">';
 if(!klausur) form+='<label>Teil<select id="ft"><option value="">Alle Teile</option>'+opt(teile,x=>{const t=D.teile.find(t=>t.kurz==="Teil "+x);return t?t.kurz+" · "+t.lang:"Teil "+x})+'</select></label>'
   +'<label>Tag<select id="fd"><option value="">Alle Tage</option>'+opt(tage,x=>"Tag "+x+(D.tage[x]?" · "+D.tage[x].titel:""))+'</select></label>'
   +'<label>Quizart<select id="fs"><option value="">Alle</option><option>Tagesquiz</option><option>Übungsquiz 1</option><option>Übungsquiz 2</option></select></label>'
   +'<label>Anzahl<select id="fn"><option>10</option><option selected>20</option><option>40</option><option value="0">Alle</option></select></label>'
   +'<label>Feedback<select id="fm"><option value="sofort">Sofort nach jeder Frage</option><option value="ende">Am Ende</option></select></label>';
 else form+='<label>Zeit<select id="fz"><option value="0">Ohne Zeitlimit</option><option value="30">30 Minuten</option><option value="45">45 Minuten</option><option value="60" selected>60 Minuten</option></select></label>';
 form+='</div><button class="knopf gross" id="los">'+(klausur?"Probeklausur starten":"Training starten")+'</button><div class="fort" id="anz" style="margin-top:8px;text-align:center"></div></div><div id="qz"></div>';
 T.innerHTML=form;
 const filt=()=>klausur?POOL:POOL.filter(q=>(!$("#ft").value||q.teil===$("#ft").value)&&(!$("#fd").value||q.tag===$("#fd").value)&&(!$("#fs").value||q.src===$("#fs").value));
 const upd=()=>{$("#anz").textContent=filt().length+" Fragen verfügbar"};
 T.querySelectorAll("select").forEach(s=>s.addEventListener("change",upd));upd();
 $("#los").onclick=()=>{let a=mischen(filt());const k=klausur?30:+$("#fn").value; if(k) a=a.slice(0,k);
  if(!a.length){$("#anz").textContent="Keine Fragen für diese Auswahl.";return}
  if(QUIZ&&QUIZ.stop) QUIZ.stop();
  QUIZ=quiz($("#qz"),a,{modus:klausur?"ende":$("#fm").value,fest:klausur,minuten:klausur?+$("#fz").value:0,meta:true});
  $("#qz").scrollIntoView({behavior:"smooth"});};
}
function mischen(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function note(p){return p>=92?"1 (sehr gut)":p>=81?"2 (gut)":p>=67?"3 (befriedigend)":p>=50?"4 (ausreichend)":p>=30?"5 (mangelhaft)":"6 (ungenügend)"}
function quiz(el,fragen,o){
 let modus=o.modus||"sofort",st=[],timer=null,ende=0,aus=false;
 function neu(){clearInterval(timer);aus=false;el.classList.remove("nurfehler");
  st=fragen.map(q=>({q:q,o:mischen(q.options.map((x,k)=>({t:x.t,c:!!x.c,k:k}))),sel:new Set(),fertig:false,ok:null}));
  zeichnen(); if(o.minuten){ende=Date.now()+o.minuten*60000;timer=setInterval(tick,1000);tick()}}
 function tick(){const s=Math.max(0,Math.round((ende-Date.now())/1000));const u=$(".uhr",el);if(u)u.textContent="Restzeit "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(!s){clearInterval(timer);auswerten()}}
 function stand(){const b=st.filter(x=>x.sel.size).length,f=st.filter(x=>x.fertig);return {b:b,f:f.length,r:f.filter(x=>x.ok).length}}
 function fHTML(i){const x=st[i],q=x.q;
  let h='<div class="frage'+(x.fertig?(x.ok?" ok":" bad"):"")+'" id="q'+i+'"><div class="fnr">Frage '+(i+1)+' von '+st.length+(o.meta&&q.tag?' · Tag '+E(q.tag)+' · '+E(q.src):"")+'</div><div class="ft">'+E(q.q)+'</div><div class="hinweis">1 oder 2 Antworten sind richtig</div>';
  x.o.forEach((a,k)=>{const g=x.sel.has(k);let c="opt",m="";
   if(x.fertig){if(a.c&&g){c+=" richtig";m="Richtig"}else if(a.c){c+=" fehlt";m="Wäre richtig"}else if(g){c+=" falsch";m="Falsch"}}else if(g)c+=" gew";
   h+='<label class="'+c+'"><input type="checkbox" data-i="'+i+'" data-k="'+k+'"'+(g?" checked":"")+(x.fertig?" disabled":"")+'><span>'+E(a.t)+'</span>'+(m?'<span class="m">'+m+'</span>':"")+'</label>'});
  if(!x.fertig&&modus==="sofort") h+='<button class="knopf" data-p="'+i+'"'+(x.sel.size?"":" disabled")+'>Antwort prüfen</button>';
  if(x.fertig) h+='<div class="urteil '+(x.ok?"ok":"bad")+'">'+(x.ok?"Richtig.":"Leider falsch.")+'</div>'+(q.expl?'<div class="erkl"><b>Erklärung.</b> '+E(q.expl)+'</div>':"");
  return h+'</div>'}
 function kHTML(){const s=stand();let h='<div class="qkopf"><div class="qzeile">';
  if(!o.fest) h+='<div class="modus"><button data-m="sofort" class="'+(modus==="sofort"?"an":"")+'">Sofort-Feedback</button><button data-m="ende" class="'+(modus==="ende"?"an":"")+'">Auswertung am Ende</button></div>';
  h+='<span class="fort"><b>'+s.b+'</b> von '+st.length+' beantwortet'+(s.f?' · <b>'+s.r+'</b> richtig':"")+'</span>'+(o.minuten?'<span class="uhr"></span>':"")+'</div><div class="balken"><div style="width:'+(100*s.b/st.length)+'%"></div></div></div>';return h}
 function eHTML(){const s=stand();if(s.f<st.length) return "";const p=Math.round(1000*s.r/st.length)/10;
  return '<div class="ergebnis" id="erg"><div class="gz">'+s.r+' von '+st.length+' richtig</div><p>'+p.toLocaleString("de-DE")+' % · Note nach IHK-Schlüssel '+note(p)+'<br><small>Es zählt nur eine vollständig richtige Antwort.</small></p><div class="knoepfe">'+(s.r<st.length?'<button class="knopf hell" data-a="fehler">'+(el.classList.contains("nurfehler")?"Alle Fragen zeigen":"Nur Fehler zeigen")+'</button>':"")+'<button class="knopf" data-a="neu">Neu starten</button></div></div>'}
 function unten(){const s=stand();
  if(s.f===st.length) return '<div class="knoepfe" style="justify-content:center;margin:16px 0"><button class="knopf" data-a="neu">Neu starten</button><button class="knopf hell" data-a="zumerg">Zum Ergebnis</button></div>';
  if(modus==="ende") return '<div style="margin:16px 0"><button class="knopf gross" data-a="auswerten">Auswerten</button><div class="fort" style="text-align:center;margin-top:6px">'+(st.length-s.b?(st.length-s.b)+" Fragen sind noch offen":"Alle Fragen beantwortet")+'</div></div>';
  return ""}
 function zeichnen(){el.innerHTML=kHTML()+'<div class="ergplatz">'+eHTML()+'</div><div class="fragen">'+st.map((x,i)=>fHTML(i)).join("")+'</div><div class="untenplatz">'+unten()+'</div>'}
 function teil(){el.querySelector(".qkopf").outerHTML=kHTML();$(".ergplatz",el).innerHTML=eHTML();$(".untenplatz",el).innerHTML=unten();if(o.minuten)tick()}
 function frageNeu(i){const q=el.querySelector("#q"+i);if(q)q.outerHTML=fHTML(i)}
 function zumErg(){setTimeout(()=>{const e=$("#erg",el);if(e)e.scrollIntoView({behavior:"smooth",block:"start"})},150)}
 function pruefen(i){const x=st[i];x.fertig=true;x.ok=x.o.every(a=>a.c===x.sel.has(x.o.indexOf(a)));frageNeu(i);teil();if(stand().f===st.length){clearInterval(timer);zumErg()}}
 function auswerten(){if(aus)return;aus=true;clearInterval(timer);st.forEach(x=>{if(!x.fertig){x.fertig=true;x.ok=x.o.every((a,k)=>a.c===x.sel.has(k))}});zeichnen();zumErg()}
 el.onchange=e=>{const c=e.target;if(c.dataset.i==null)return;const i=+c.dataset.i,k=+c.dataset.k,x=st[i];if(x.fertig)return;if(c.checked)x.sel.add(k);else x.sel.delete(k);frageNeu(i);teil()};
 el.onclick=e=>{const b=e.target.closest("button");if(!b||!el.contains(b))return;
  if(b.dataset.p!=null){pruefen(+b.dataset.p);return}
  if(b.dataset.m){modus=b.dataset.m;zeichnen();return}
  const a=b.dataset.a;
  if(a==="auswerten")auswerten();
  else if(a==="neu"){neu();el.scrollIntoView({behavior:"smooth"})}
  else if(a==="fehler"){el.classList.toggle("nurfehler");teil()}
  else if(a==="zumerg")zumErg()};
 neu();
 return {stop:()=>clearInterval(timer)};
}
