<title>Geschäftsprozesse 2026 · Waybuild Akademie</title>
<style>
:root{--navy:#0b2e4f;--blau:#0077A6;--blau2:#0a8fc4;--hblau:#e8f4fa;--orange:#E8833A;--horange:#fdf0e5;--gruen:#1f8a4c;--hgruen:#e6f5ec;--rot:#c84b3c;--hrot:#fcebe8;--lila:#6f4bb2;--hlila:#f0ebfa;--grau:#5b6b78;--rand:#e1e8ee;--bg:#f4f7fa;--karte:#fff;--sch1:0 1px 2px #0b2e4f0d,0 1px 3px #0b2e4f0a;--sch2:0 14px 34px -12px #0b2e4f33,0 4px 10px -4px #0b2e4f1a;--r:18px;--oben:0px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:#1b2a38;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
a{color:var(--blau)}
button,select,input{font:inherit}
svg{width:22px;height:22px;flex:none}
:focus-visible{outline:3px solid #0a8fc466;outline-offset:2px;border-radius:10px}
/* Zugang */
#tor{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 600px at 10% -10%,#d7ecf6 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#fde3cf 0,transparent 55%),var(--bg)}
.torbox{background:#fff;border:1px solid var(--rand);border-radius:24px;padding:34px 30px;max-width:420px;width:100%;box-shadow:var(--sch2);text-align:center}
.torbox img{height:58px}.torbox h1{font-size:22px;color:var(--navy);margin:16px 0 4px;letter-spacing:-.01em}.torbox p{color:var(--grau);margin:0 0 20px}
.torbox input{width:100%;font-size:20px;padding:13px 14px;border:1.5px solid #c3d3de;border-radius:14px;text-align:center;letter-spacing:4px;text-transform:uppercase;transition:border-color .15s,box-shadow .15s}
.torbox input:focus{outline:none;border-color:var(--blau);box-shadow:0 0 0 4px #0077a626}
.torbox button{margin-top:12px;width:100%;font-size:17px;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--blau),var(--navy));color:#fff;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s}
.torbox button:hover{transform:translateY(-1px);box-shadow:0 10px 22px -8px #0077a6aa}
#err{color:var(--rot);margin-top:10px;min-height:1.2em;font-size:14px}
/* Rahmen */
.app{display:none}
.app.on{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
.seite{position:sticky;top:0;height:100vh;overflow:auto;background:#fff;border-right:1px solid var(--rand);padding:18px 14px 30px;scrollbar-width:thin}
.marke{display:flex;align-items:center;gap:10px;padding:2px 6px 16px;border-bottom:1px solid var(--rand);margin-bottom:12px;text-decoration:none}
.marke img{height:40px}.marke span{font-size:12.5px;color:var(--grau);line-height:1.35}
.seite .marke{flex-direction:column;align-items:flex-start;gap:8px}
.nav a,.nav summary{position:relative;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:#1b2a38;text-decoration:none;font-size:14.5px;cursor:pointer;transition:background .15s,color .15s,transform .15s}
.nav a:hover,.nav summary:hover{background:#f1f6f9;color:var(--navy)}
.nav a:hover{transform:translateX(2px)}
.nav a.aktiv{background:var(--hblau);color:var(--navy);font-weight:650}
.nav a.aktiv::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--blau)}
.nav a svg{color:var(--blau);width:19px;height:19px}
.nav .gr{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8697a4;margin:18px 12px 6px;font-weight:700}
.nav details{margin:2px 0}.nav summary{font-weight:650;color:var(--navy);list-style:none;font-size:13.5px;line-height:1.35}
.nav summary::-webkit-details-marker{display:none}
.nav summary::after{content:"";margin-left:auto;flex:none;width:7px;height:7px;border-right:2px solid #8697a4;border-bottom:2px solid #8697a4;transform:rotate(-45deg);transition:transform .2s}
.nav details[open] summary::after{transform:rotate(45deg)}
.nav .tg{padding:6px 10px 6px 12px;font-size:13.5px;gap:10px}
.nav .tg b{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;border-radius:7px;background:#eef3f7;color:var(--blau);font-weight:700;font-size:12px}
.nav .tg.heute b{background:var(--orange);color:#fff}
.nav .tg.aktiv b{background:var(--blau);color:#fff}
.nav .tg em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.haupt{padding:26px 40px 70px;max-width:1240px;width:100%;margin:0 auto}
.app.zu-seite{--oben:62px}
.einklapp{position:absolute;top:18px;right:12px;border:1px solid var(--rand);background:#fff;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--navy);cursor:pointer;transition:all .15s}
.einklapp:hover,.ausklapp:hover{border-color:var(--blau);color:var(--blau);box-shadow:var(--sch1)}
.einklapp svg,.ausklapp svg{width:18px;height:18px}
.ausklapp{display:none;position:fixed;top:14px;left:14px;z-index:30;align-items:center;gap:8px;border:1px solid var(--rand);background:#fff;border-radius:12px;padding:8px 14px 8px 10px;color:var(--navy);font-weight:600;cursor:pointer;box-shadow:var(--sch2)}
.app.on.zu-seite{grid-template-columns:minmax(0,1fr)}
.app.zu-seite .seite{display:none}
.app.zu-seite .ausklapp{display:flex}
.app.zu-seite .haupt{max-width:1400px;padding-top:70px}
.topbar,.unten,.schleier{display:none}
.bc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--grau);margin-bottom:10px}
.bc a{color:var(--grau);text-decoration:none}.bc a:hover{color:var(--blau)}
.bc i{font-style:normal;color:#b3bfc8}
.zurueck{display:inline-flex;align-items:center;gap:4px;padding:7px 14px 7px 9px;border:1px solid var(--rand);background:#fff;border-radius:999px;color:var(--navy);text-decoration:none;font-weight:600;font-size:13.5px;margin:0 8px 14px 0;transition:all .15s}
.zurueck:hover{border-color:var(--blau);color:var(--blau);transform:translateX(-2px)}.zurueck svg{width:18px;height:18px}
h1.st{font-size:30px;line-height:1.2;color:var(--navy);margin:8px 0 6px;letter-spacing:-.02em}
.sub{color:var(--grau);margin:0 0 22px;font-size:15.5px}
.chip{display:inline-block;font-size:12px;font-weight:650;padding:3px 10px;border-radius:999px;background:var(--hblau);color:var(--blau);vertical-align:middle}
.chip.o{background:var(--orange);color:#fff}.chip.g{background:#eef1f4;color:#7b8a96}.chip.v{background:var(--hrot);color:var(--rot)}
h2.ab{font-size:18px;color:var(--navy);margin:32px 0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;letter-spacing:-.01em}
h2.ab::after{content:"";flex:1;min-width:30px;height:1px;background:linear-gradient(90deg,var(--rand),transparent)}
h2.ab svg{color:var(--blau);width:20px;height:20px}
h2.ab small{font-weight:500;color:var(--grau);font-size:13.5px}
/* Kacheln */
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.kachel{--f:var(--blau);--h:var(--hblau);position:relative;display:flex;flex-direction:column;gap:4px;min-height:150px;text-decoration:none;color:inherit;background:var(--karte);border:1px solid var(--rand);border-radius:var(--r);padding:18px 18px 16px;box-shadow:var(--sch1);overflow:hidden;transition:transform .2s cubic-bezier(.2,.7,.2,1),box-shadow .2s,border-color .2s}
.kachel::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--f);opacity:0;transition:opacity .2s}
.kachel.f-gruen{--f:var(--gruen);--h:var(--hgruen)}.kachel.f-lila{--f:var(--lila);--h:var(--hlila)}.kachel.f-rot{--f:var(--rot);--h:var(--hrot)}.kachel.f-orange{--f:var(--orange);--h:var(--horange)}
a.kachel:hover{transform:translateY(-4px);box-shadow:var(--sch2);border-color:color-mix(in srgb,var(--f) 35%,var(--rand))}

async function oeffnen(code){
 const raw=Uint8Array.from(atob(DATEN),c=>c.charCodeAt(0));
 const salt=raw.slice(8,16),ct=raw.slice(16);
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveBits"]);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},base,384));
 const key=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-CBC",iv:bits.slice(32,48)},key,ct);
 const d=JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(pt));
 if(d.marker!=="gp2026") throw new Error("falsch");
 D=d; try{localStorage.setItem("gp2026code",code)}catch(e){}
 $("#tor").style.display="none"; $("#app").classList.add("on");
 aufbauen(); route();
}
$("#f").addEventListener("submit",async e=>{e.preventDefault();const c=$("#c").value.trim().toUpperCase();
 try{await oeffnen(c);$("#err").textContent=""}catch(x){$("#err").textContent="Der Zugangscode stimmt nicht."}});
(async()=>{let c=null;try{c=localStorage.getItem("gp2026code")}catch(e){} if(c){try{await oeffnen(c)}catch(e){try{localStorage.removeItem("gp2026code")}catch(_){}}}})();

function heuteISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function heuteTag(){const h=heuteISO();return D.reihenfolge.find(n=>D.tage[n].datum===h)||null}
function naechsterTag(){const h=heuteISO();return D.reihenfolge.find(n=>D.tage[n].datum>h)||null}
function istHeute(n){return D.tage[n].datum===heuteISO()}

function route(){
 if(!D) return;
 if(QUIZ&&QUIZ.stop) QUIZ.stop(); QUIZ=null;
 document.querySelectorAll("video").forEach(v=>v.pause());
 menue(false);
 const h=decodeURIComponent((location.hash||"").slice(1));
 const H=$("#haupt");
 if(h==="heute"){const t=heuteTag()||naechsterTag(); location.replace(t?"#tag"+t:"#"); return}
 const m=h.match(/^tag(\d\d)(?:-(nachmittag|video|quiz|uebung1|uebung2|morgen))?$/);
 if(m&&D.tage[m[1]]){const n=m[1],s=m[2]||"";
  if(!s) H.innerHTML=seiteTag(n);
  else if(s==="nachmittag") H.innerHTML=seiteNachmittag(n);
  else if(s==="video"){H.innerHTML=seiteVideo(n);untertitel()}
  else seiteQuiz(H,n,s);
 } else if(h==="trainer") seiteTrainer(H,false);
 else if(h==="klausur") seiteTrainer(H,true);
 else if(h==="lek") seiteTrainer(H,false,true);
 else H.innerHTML=seiteStart();
 window.scrollTo(0,0);
}

function untertitel(){const v=$("#haupt video"),b=$("#utknopf");if(!v||!v.textTracks||!v.textTracks.length)return;
 let an=true;try{an=localStorage.getItem("gp2026ut")!=="aus"}catch(e){}
 const setz=a=>{for(const t of v.textTracks)t.mode=a?"showing":"hidden";if(b){b.textContent=a?"Untertitel ausblenden":"Untertitel einblenden";b.setAttribute("aria-pressed",a?"true":"false")}};
 setz(an);const tr=v.querySelector("track");if(tr)tr.addEventListener("load",()=>setz(an));
 v.textTracks.addEventListener("change",()=>{const a=[...v.textTracks].some(t=>t.mode==="showing");an=a;try{localStorage.setItem("gp2026ut",a?"an":"aus")}catch(e){}if(b){b.textContent=a?"Untertitel ausblenden":"Untertitel einblenden";b.setAttribute("aria-pressed",a?"true":"false")}});
 if(b)b.onclick=()=>{an=!an;try{localStorage.setItem("gp2026ut",an?"an":"aus")}catch(e){}setz(an)};
}

 else if(v.typ==="datei") h+='<div class="player"><video controls preload="metadata" playsinline src="'+E(v.src)+'">'+(v.ut?'<track kind="subtitles" srclang="de" label="Deutsch" default src="'+E(v.ut)+'">':'')+'</video></div>'

async function seiteQuiz(H,n,s){const d=D.tage[n];
 const uebung=s.indexOf("uebung")===0,nr=uebung?s.slice(-1):"",morgen=s==="morgen";
 const zur=uebung?["Zurück zum Nachmittag","#tag"+n+"-nachmittag"]:["Zurück zu Tag "+n,"#tag"+n];
 const name=uebung?"Übungsquiz "+nr:morgen?"Morgenstart":"Quiz";
 const bc=[["Übersicht","#"],["Tag "+n,"#tag"+n]].concat(uebung?[["Nachmittag","#tag"+n+"-nachmittag"]]:[]).concat([[name,""]]);
 let kopf=rahmen({kurz:"Tag "+n+" · "+name,bc:bc,zurueck:zur,akt:"tag",tag:n});
 const frei=uebung?d.frei2:morgen?!!d.morgen:d.frei1;
 const quelle=uebung?(d.uebungen||[]).find(u=>u.nr===nr):morgen?d.morgen:(d.quiz?{src:d.quiz}:null);
 kopf+='<h1 class="st">Tag '+n+' · '+name+'</h1><p class="sub">'+E(morgen&&d.morgen?d.morgen.info+" · "+d.morgen.anzahl+" Fragen zum Tagesbeginn":d.titel)+'</p>';
 if(!frei||!quelle){H.innerHTML=kopf+'<p>Dieses Quiz ist noch gesperrt.</p>'+fuss();return}
 H.innerHTML=kopf+'<div id="qz"><div class="laden">Fragen werden geladen …</div></div><div class="knoepfe" style="margin-top:8px"><a class="knopf hell" href="'+zur[1]+'">'+I("links")+E(zur[0])+'</a></div>'+fuss();
 try{const r=await fetch(quelle.src);const fr=await r.json(); if(location.hash.slice(1)!=="tag"+n+"-"+s) return;
  QUIZ=quiz($("#qz"),fr,{modus:"sofort"});}catch(e){$("#qz").innerHTML='<p>Die Fragen konnten nicht geladen werden. Bitte Seite neu laden.</p>'}
}

 const name=lek?"LEK-Vorbereitung":klausur?"Probeklausur":"Quiz-Trainer",r0=lek?"lek":klausur?"klausur":"trainer";
 let h=rahmen({kurz:name,bc:[["Übersicht","#"],[name,""]],zurueck:["Übersicht","#"],akt:lek?"trainer":r0});
 h+='<h1 class="st">'+name+'</h1><p class="sub">'+(lek?"Prüfungsfragen zu den Inhalten von Tag 01 bis 18 im Stil der LEK. Gesetzestexte und alle nötigen Angaben stehen in der Aufgabe.":klausur?"30 zufällige Fragen aus allen freigegebenen Tagen. Die Auswertung kommt am Ende, mit Note nach IHK-Schlüssel.":"Fragen gezielt nach Teil, Tag oder Quizart üben.")+'</p><div id="tr"><div class="laden">Fragen werden geladen …</div></div>'+fuss();
 H.innerHTML=h;
 if(!D.kurs||(lek&&!D.kurs.lek)){$("#tr").innerHTML="<p>Noch nicht verfügbar.</p>";return}
 let PX;
 try{if(lek){if(!LEKPOOL){const r=await fetch(D.kurs.lek);LEKPOOL=await r.json()}PX=LEKPOOL}else{if(!POOL){const r=await fetch(D.kurs.pool);POOL=await r.json()}PX=POOL}}catch(e){$("#tr").innerHTML='<p>Die Fragen konnten nicht geladen werden. Bitte Seite neu laden.</p>';return}
 if(location.hash.slice(1)!==r0) return;
 const T=$("#tr");
 const teile=[...new Set(PX.map(q=>q.teil))].sort(),tage=[...new Set(PX.map(q=>q.tag))].sort();
 const opt=(a,f)=>a.map(x=>'<option value="'+E(x)+'">'+E(f(x))+'</option>').join("");
 let form='<div class="karte"><div class="felder">';
 if(!klausur) form+='<label>Teil<select id="ft"><option value="">Alle Teile</option>'+opt(teile,x=>{const t=D.teile.find(t=>t.kurz==="Teil "+x);return t?t.kurz+" · "+t.lang:"Teil "+x})+'</select></label>'
   +'<label>Tag<select id="fd"><option value="">Alle Tage</option>'+opt(tage,x=>"Tag "+x+(D.tage[x]?" · "+D.tage[x].titel:""))+'</select></label>'
   +(lek?'':'<label>Quizart<select id="fs"><option value="">Alle</option><option>Tagesquiz</option><option>Übungsquiz 1</option><option>Übungsquiz 2</option></select></label>')
   +'<label>Anzahl<select id="fn"><option>10</option><option selected>20</option><option>40</option>'+(lek?'<option>60</option>':'')+'<option value="0">Alle</option></select></label>'
   +'<label>Feedback<select id="fm"><option value="sofort">Sofort nach jeder Frage</option><option value="ende">Am Ende</option></select></label>';
 else form+='<label>Zeit<select id="fz"><option value="0">Ohne Zeitlimit</option><option value="30">30 Minuten</option><option value="45">45 Minuten</option><option value="60" selected>60 Minuten</option></select></label>';
 form+='</div><button class="knopf gross" id="los">'+(klausur?"Probeklausur starten":"Training starten")+'</button><div class="fort" id="anz" style="margin-top:8px;text-align:center"></div></div><div id="qz"></div>';
 T.innerHTML=form;
 const filt=()=>klausur?PX:PX.filter(q=>(!$("#ft").value||q.teil===$("#ft").value)&&(!$("#fd").value||q.tag===$("#fd").value)&&(lek||!$("#fs").value||q.src===$("#fs").value));
 const upd=()=>{$("#anz").textContent=filt().length+" Fragen verfügbar"};
 T.querySelectorAll("select").forEach(s=>s.addEventListener("change",upd));upd();
 $("#los").onclick=()=>{let a=mischen(filt());const k=klausur?30:+$("#fn").value; if(k) a=a.slice(0,k);
  if(!a.length){$("#anz").textContent="Keine Fragen für diese Auswahl.";return}
  if(QUIZ&&QUIZ.stop) QUIZ.stop();
  QUIZ=quiz($("#qz"),a,{modus:klausur?"ende":$("#fm").value,fest:klausur,minuten:klausur?+$("#fz").value:0,meta:true});
  $("#qz").scrollIntoView({behavior:"smooth"});};
}
function mischen(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function note(p){return p>=92?"1 (sehr gut)":p>=81?"2 (gut)":p>=67?"3 (befriedigend)":p>=50?"4 (ausreichend)":p>=30?"5 (mangelhaft)":"6 (ungenügend)"}
function quiz(el,fragen,o){
 let modus=o.modus||"sofort",st=[],timer=null,ende=0,aus=false;
 function neu(){clearInterval(timer);aus=false;el.classList.remove("nurfehler");
  st=fragen.map(q=>({q:q,o:mischen(q.options.map((x,k)=>({t:x.t,c:!!x.c,k:k}))),sel:new Set(),fertig:false,ok:null}));
  zeichnen(); if(o.minuten){ende=Date.now()+o.minuten*60000;timer=setInterval(tick,1000);tick()}}
 function tick(){const s=Math.max(0,Math.round((ende-Date.now())/1000));const u=$(".uhr",el);if(u)u.textContent="Restzeit "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(!s){clearInterval(timer);auswerten()}}
 function stand(){const b=st.filter(x=>x.sel.size).length,f=st.filter(x=>x.fertig);return {b:b,f:f.length,r:f.filter(x=>x.ok).length}}
 function fHTML(i){const x=st[i],q=x.q;
  let h='<div class="frage'+(x.fertig?(x.ok?" ok":" bad"):"")+'" id="q'+i+'"><div class="fnr">Frage '+(i+1)+' von '+st.length+(o.meta&&q.tag?' · Tag '+E(q.tag)+' · '+E(q.src):"")+'</div>'+(q.situation?'<div class="sit">'+E(q.situation)+'</div>':"")+((q.gesetz||[]).map(g=>'<div class="gz2"><b>Gesetzesauszug '+E(g.norm)+'</b>\n'+E(g.text)+'</div>').join(""))+'<div class="ft">'+E(q.q)+'</div><div class="hinweis">'+(q.src==="LEK"?(q.options.filter(z=>z.c).length===1?"Genau 1 Antwort ist richtig":"Genau 2 Antworten sind richtig"):"1 oder 2 Antworten sind richtig")+'</div>';
  x.o.forEach((a,k)=>{const g=x.sel.has(k);let c="opt",m="";
   if(x.fertig){if(a.c&&g){c+=" richtig";m="Richtig"}else if(a.c){c+=" fehlt";m="Wäre richtig"}else if(g){c+=" falsch";m="Falsch"}}else if(g)c+=" gew";
   h+='<label class="'+c+'"><input type="checkbox" data-i="'+i+'" data-k="'+k+'"'+(g?" checked":"")+(x.fertig?" disabled":"")+'><span>'+E(a.t)+'</span>'+(m?'<span class="m">'+m+'</span>':"")+'</label>'});
  if(!x.fertig&&modus==="sofort") h+='<button class="knopf" data-p="'+i+'"'+(x.sel.size?"":" disabled")+'>Antwort prüfen</button>';
  if(x.fertig) h+='<div class="urteil '+(x.ok?"ok":"bad")+'">'+(x.ok?"Richtig.":"Leider falsch.")+'</div>'+(q.expl?'<div class="erkl"><b>Erklärung.</b> '+E(q.expl)+'</div>':"");
  return h+'</div>'}
 function kHTML(){const s=stand();let h='<div class="qkopf"><div class="qzeile">';
  if(!o.fest) h+='<div class="modus"><button data-m="sofort" class="'+(modus==="sofort"?"an":"")+'">Sofort-Feedback</button><button data-m="ende" class="'+(modus==="ende"?"an":"")+'">Auswertung am Ende</button></div>';
  h+='<span class="fort"><b>'+s.b+'</b> von '+st.length+' beantwortet'+(s.f?' · <b>'+s.r+'</b> richtig':"")+'</span>'+(o.minuten?'<span class="uhr"></span>':"")+'</div><div class="balken"><div style="width:'+(100*s.b/st.length)+'%"></div></div></div>';return h}
 function eHTML(){const s=stand();if(s.f<st.length) return "";const p=Math.round(1000*s.r/st.length)/10;
  return '<div class="ergebnis" id="erg"><div class="gz">'+s.r+' von '+st.length+' richtig</div><p>'+p.toLocaleString("de-DE")+' % · Note nach IHK-Schlüssel '+note(p)+'<br><small>Es zählt nur eine vollständig richtige Antwort.</small></p><div class="knoepfe">'+(s.r<st.length?'<button class="knopf hell" data-a="fehler">'+(el.classList.contains("nurfehler")?"Alle Fragen zeigen":"Nur Fehler zeigen")+'</button>':"")+'<button class="knopf" data-a="neu">Neu starten</button></div></div>'}
 function unten(){const s=stand();
  if(s.f===st.length) return '<div class="knoepfe" style="justify-content:center;margin:16px 0"><button class="knopf" data-a="neu">Neu starten</button><button class="knopf hell" data-a="zumerg">Zum Ergebnis</button></div>';
  if(modus==="ende") return '<div style="margin:16px 0"><button class="knopf gross" data-a="auswerten">Auswerten</button><div class="fort" style="text-align:center;margin-top:6px">'+(st.length-s.b?(st.length-s.b)+" Fragen sind noch offen":"Alle Fragen beantwortet")+'</div></div>';
  return ""}
 function zeichnen(){el.innerHTML=kHTML()+'<div class="ergplatz">'+eHTML()+'</div><div class="fragen">'+st.map((x,i)=>fHTML(i)).join("")+'</div><div class="untenplatz">'+unten()+'</div>'}
 function teil(){el.querySelector(".qkopf").outerHTML=kHTML();$(".ergplatz",el).innerHTML=eHTML();$(".untenplatz",el).innerHTML=unten();if(o.minuten)tick()}
 function frageNeu(i){const q=el.querySelector("#q"+i);if(q)q.outerHTML=fHTML(i)}
 function zumErg(){setTimeout(()=>{const e=$("#erg",el);if(e)e.scrollIntoView({behavior:"smooth",block:"start"})},150)}
 function pruefen(i){const x=st[i];x.fertig=true;x.ok=x.o.every(a=>a.c===x.sel.has(x.o.indexOf(a)));frageNeu(i);teil();if(stand().f===st.length){clearInterval(timer);zumErg()}}
 function auswerten(){if(aus)return;aus=true;clearInterval(timer);st.forEach(x=>{if(!x.fertig){x.fertig=true;x.ok=x.o.every((a,k)=>a.c===x.sel.has(k))}});zeichnen();zumErg()}
 el.onchange=e=>{const c=e.target;if(c.dataset.i==null)return;const i=+c.dataset.i,k=+c.dataset.k,x=st[i];if(x.fertig)return;if(c.checked)x.sel.add(k);else x.sel.delete(k);frageNeu(i);teil()};
 el.onclick=e=>{const b=e.target.closest("button");if(!b||!el.contains(b))return;
  if(b.dataset.p!=null){pruefen(+b.dataset.p);return}
  if(b.dataset.m){modus=b.dataset.m;zeichnen();return}
  const a=b.dataset.a;
  if(a==="auswerten")auswerten();
  else if(a==="neu"){neu();el.scrollIntoView({behavior:"smooth"})}
  else if(a==="fehler"){el.classList.toggle("nurfehler");teil()}
  else if(a==="zumerg")zumErg()};
 neu();
 return {stop:()=>clearInterval(timer)};
}
</script></body></html>
